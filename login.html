<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
  
<body>
  <div class="login-container">
    <form class="login-form" id="loginForm">
      <div class="user-avatar-container">
        <img src="https://via.placeholder.com/120" alt="User Avatar" class="user-icon">
      </div>

      <div class="form-content">
        <div class="input-group">
          <input type="text" id="username" class="form-input" placeholder="Usuario" required>
          <input type="password" id="password" class="form-input" placeholder="Contraseña" required>
        </div>
        <div class="error-message" id="errorMessage"></div>
        <button type="submit" class="login-button" id="loginButton">Iniciar sesión</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
